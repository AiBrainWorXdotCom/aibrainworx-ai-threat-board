[package]
name = "aibrainworx-threat-board"
version = "0.1.0"
edition = "2021"
description = "AiBrainWorX AI Cybersecurity Threat Analysis Board - Rust Backend"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip"] }
reqwest = { version = "0.12", features = ["json", "gzip", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
feed-rs = "2"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
